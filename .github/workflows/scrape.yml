name: SS-Collector

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours — v2nodes keys rotate frequently
  workflow_dispatch: {}

# ponytail: concurrency cancels stale runs; add if a run ever overlaps on a busy key
concurrency:
  group: ss-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Scrape configs (fresh keys)
        run: python3 scripts/scrape.py

      - name: Test reachability (TCP)
        run: python3 scripts/test.py

      - name: Publish + regenerate README
        run: python3 scripts/publish.py

      - name: Commit
        run: |
          git config user.name "SS-Collector Bot"
          git config user.email "ss-collector@users.noreply.github.com"
          # clean up intermediates — only ship user-facing artifacts
          rm -f scraped.json tested.json
          git add -A configs test_report.json README.md
          git diff --cached --quiet || {
            git commit -m "Auto: update configs & README ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          }
