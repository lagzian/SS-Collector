name: SS-Collector

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: ss-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Scrape configs (keys rotate — fresh every run)
        run: python3 scripts/scrape.py

      # ponytail: TCP reachability test on the GitHub runner (assumption a).
      # ~415 configs × 8s timeout across 128 workers ≈ 5 min. Upgrade to
      # protocol-level (v2ray handshake) only if TCP proves too permissive.
      - name: Test reachability (TCP, inside GitHub)
        run: python3 scripts/test.py

      - name: Publish configs + regenerate README
        run: python3 scripts/publish.py

      - name: Commit & push
        run: |
          git config user.name "SS-Collector Bot"
          git config user.email "ss-collector@users.noreply.github.com"
          rm -f scraped.json tested.json
          git add -A configs test_report.json README.md
          git diff --cached --quiet || {
            git commit -m "Auto: update configs & README ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          }
